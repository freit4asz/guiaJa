<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar – GuiaJa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="topo"></div>
<main>
  <div class="form">
    <h1>Bem-vindo de volta!</h1>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email"></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password"></div>
    <button class="btn" id="entrar">Entrar</button>
    <p class="msg" id="msg" role="alert"></p>
    <p style="margin-top:14px">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
</main>
<div id="rodape"></div>
<script src="app.js"></script>
<script>
  layout();
  let erros = 0;
  $('#entrar').onclick = async () => {
    if (erros >= 5) return mensagem('Muitas tentativas. Aguarde um momento e atualize a página.');
    try {
      const u = await api('/api/login', {email: $('#email').value.trim(), senha: $('#senha').value});
      salvar('sessao', u);      // {id, nome, email}
      location.href = 'index.html';
    } catch (e) { erros++; mensagem(e.message); }
  };
</script>
</body></html>
