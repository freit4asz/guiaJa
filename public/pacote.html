<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detalhes do pacote – GuiaJa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="topo"></div>
<main class="miolo" id="conteudo"></main>
<div id="rodape"></div>
<script src="app.js"></script>
<script>
  layout();
  const idPacote = new URLSearchParams(location.search).get('id');
  Promise.all([api('/api/pacotes/' + idPacote), api('/api/guias'), api('/api/hoteis')])
    .then(([p, GUIAS, HOTEIS]) => {
      $('#conteudo').innerHTML = `
        <h1>${p.nome}</h1><p>${p.tipo} · ${p.dias} dias · a partir de <strong>${moeda(p.preco)}</strong></p><br>
        <div class="detalhe">
          <div class="caixa"><h2>Roteiro da viagem</h2><ul>${p.roteiro.map((r, i) => `<li><strong>Dia ${i + 1}:</strong> ${r}</li>`).join('')}</ul></div>
          <div class="caixa">
            <h2>Monte sua reserva</h2>
            <div class="campo"><label for="guia">Escolha seu guia</label><select id="guia">${GUIAS.map(g => `<option value="${g.id}">${g.nome} – ${moeda(g.valorHora)}/h</option>`).join('')}</select></div><br>
            <div class="campo"><label for="hotel"><input type="checkbox" id="incluir-hotel" checked> Incluir hospedagem</label><select id="hotel">${HOTEIS.map(h => `<option value="${h.id}">${h.nome} – ${moeda(h.diaria)}/noite</option>`).join('')}</select></div><br>
            <div class="campo"><label for="data">Data de ida</label><input type="date" id="data"></div>
            <div class="total" id="total"></div>
            <button class="btn" id="reservar">Adicionar ao carrinho</button>
            <p class="msg" id="msg" role="status"></p>
          </div>
        </div>`;
      // Data mínima: hoje
      $('#data').min = new Date().toISOString().slice(0, 10);
      // Prévia do total (o servidor recalcula na hora de gravar):
      // preço do pacote + diária x dias + valor/hora do guia x 4h x dias
      function calcular() {
        const g = GUIAS.find(x => x.id == $('#guia').value);
        const hotel = $('#incluir-hotel').checked ? HOTEIS.find(x => x.id == $('#hotel').value) : null;
        const hotelTotal = hotel ? hotel.diaria * p.dias : 0;
        return p.preco + hotelTotal + g.valorHora * 4 * p.dias;
      }
      const atualizar = () => {
        $('#hotel').disabled = !$('#incluir-hotel').checked;
        $('#total').textContent = 'Total: ' + moeda(calcular());
      };
      $('#guia').onchange = $('#hotel').onchange = atualizar;
      $('#incluir-hotel').onchange = atualizar;
      atualizar();

      $('#reservar').onclick = () => {
        const dataIda = $('#data').value;
        if (!dataIda) { mensagem('Escolha a data de ida.'); return; }
        if (dataIda < new Date().toISOString().slice(0, 10)) { mensagem('Escolha uma data que não seja no passado.'); return; }
        const guia = GUIAS.find(x => x.id == $('#guia').value);
        const hotel = $('#incluir-hotel').checked ? HOTEIS.find(x => x.id == $('#hotel').value) : null;
        adicionarAoCarrinho({
          tipo: 'pacote',
          idPacote: p.id,
          nome: p.nome,
          emoji: p.emoji || '✈️',
          dias: p.dias,
          idGuia: guia.id,
          guiaNome: guia.nome,
          idHospedagem: hotel ? hotel.id : null,
          hotelNome: hotel ? hotel.nome : 'Sem hospedagem',
          dataIda,
          total: calcular()
        });
      };
    })
    .catch(e => $('#conteudo').innerHTML = `<p class="msg erro" style="display:block">${e.message} <a href="pacotes.html">Ver todos os pacotes</a></p>`);
</script>
</body></html>
