<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detalhes do pacote – GuiaJa</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="topo"></div>
<main class="miolo" id="conteudo"></main>
<div id="rodape"></div>
<script src="app.js"></script>
<script>
  layout();
  const idPacote = new URLSearchParams(location.search).get('id');
  Promise.all([api('/api/pacotes/' + idPacote), api('/api/guias'), api('/api/hoteis')])
    .then(([p, GUIAS, HOTEIS]) => {
      const packageHotels = HOTEIS.filter(hotel => Number(hotel.idDestino) === Number(p.idDestino));
      $('#conteudo').innerHTML = `
        <h1>${htmlSeguro(p.nome)}</h1><p>Destino fixo: ${htmlSeguro([p.cidade, p.estado, p.pais].filter(Boolean).join(', '))}</p>
        <p>${htmlSeguro(p.tipo)} · ${p.dias} dias · pacote de <span class="preco-original"><del>${moeda(p.precoOriginal)}</del></span> por <strong>${moeda(p.preco)}</strong> (${p.descontoPercentual}% de desconto)</p><br>
        <div class="detalhe">
          <div class="caixa"><h2>Roteiro da viagem</h2><ul>${p.roteiro.map((r, i) => `<li><strong>Dia ${i + 1}:</strong> ${htmlSeguro(r)}</li>`).join('')}</ul></div>
          <div class="caixa">
            <h2>Monte sua reserva</h2>
            <div class="campo"><label for="guia">Escolha seu guia (opcional)</label><select id="guia"><option value="">Sem guia</option>${GUIAS.map(g => `<option value="${g.id}">${htmlSeguro(g.nome)}${g.local ? ` · ${htmlSeguro(g.local)}` : ''} – ${moeda(g.valorHora)}/h</option>`).join('')}</select></div><br>
            ${packageHotels.length
              ? `<div class="campo"><label for="hotel"><input type="checkbox" id="incluir-hotel" checked> Incluir hospedagem em ${htmlSeguro(p.cidade)}</label><select id="hotel">${packageHotels.map(h => `<option value="${h.id}">${htmlSeguro(h.nome)} – ${moeda(h.diaria)}/noite</option>`).join('')}</select></div><br>`
              : `<p class="admin-note">Não há hospedagem cadastrada em ${htmlSeguro(p.cidade)}; nenhuma hospedagem de outra cidade será incluída neste pacote.</p><br>`}
            <div class="campo"><label for="data">Data de ida</label><input type="date" id="data"></div>
            <div class="total" id="total"></div>
            <button class="btn" id="reservar">Adicionar ao carrinho</button>
            <p class="msg" id="msg" role="status"></p>
          </div>
        </div>`;
      // Data mínima: hoje
      $('#data').min = new Date().toISOString().slice(0, 10);
      const hotelCheckbox = $('#incluir-hotel');
      const hotelSelect = $('#hotel');
      // O desconto incide apenas no preço do pacote; guia e hospedagem mantêm o valor integral.
      function calcular() {
        const g = GUIAS.find(x => x.id == $('#guia').value);
        const hotel = hotelCheckbox?.checked ? packageHotels.find(x => x.id == Number(hotelSelect.value)) : null;
        const hotelTotal = hotel ? hotel.diaria * p.dias : 0;
        return p.preco + hotelTotal + (g ? g.valorHora * 4 * p.dias : 0);
      }
      const atualizar = () => {
        if (hotelSelect && hotelCheckbox) hotelSelect.disabled = !hotelCheckbox.checked;
        $('#total').textContent = 'Total: ' + moeda(calcular());
      };
      $('#guia').onchange = atualizar;
      if (hotelSelect) hotelSelect.onchange = atualizar;
      if (hotelCheckbox) hotelCheckbox.onchange = atualizar;
      atualizar();

      $('#reservar').onclick = () => {
        const dataIda = $('#data').value;
        if (!dataIda) { mensagem('Escolha a data de ida.'); return; }
        if (dataIda < new Date().toISOString().slice(0, 10)) { mensagem('Escolha uma data que não seja no passado.'); return; }
        const guia = GUIAS.find(x => x.id == $('#guia').value);
        const hotel = hotelCheckbox?.checked ? packageHotels.find(x => x.id == Number(hotelSelect.value)) : null;
        adicionarAoCarrinho({
          tipo: 'pacote',
          idPacote: p.id,
          nome: p.nome,
          emoji: p.emoji || '✈️',
          dias: p.dias,
          idGuia: guia ? guia.id : null,
          guiaNome: guia ? guia.nome : 'Sem guia',
          idHospedagem: hotel ? hotel.id : null,
          hotelNome: hotel ? hotel.nome : 'Sem hospedagem',
          dataIda,
          desconto: p.desconto,
          descontoPercentual: p.descontoPercentual,
          total: calcular()
        });
      };
    })
    .catch(e => $('#conteudo').innerHTML = `<p class="msg erro" style="display:block">${e.message} <a href="pacotes.html">Ver todos os pacotes</a></p>`);
</script>
</body></html>
